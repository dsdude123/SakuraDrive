# SakuraDrive on Docker inside WSL2, for tokyo-3.
#
# Everything else — schedule, notifications, thresholds, backup expectations — is
# configured from the web interface. This file only covers what Docker owns: the port,
# the data volume, and which host paths the container can see.
#
# Windows drives appear inside WSL2 under /mnt/<letter>. Every pool mount is read-only
# on purpose: SakuraDrive never writes to your data.

services:
  sakuradrive:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sakuradrive:latest
    container_name: sakuradrive
    restart: unless-stopped

    ports:
      # 8099 continues the 8096 scrutiny / 8097 youtrack / 8098 sakurafinancial block.
      # Confirm with `sudo ss -ltnp` before assuming it is free.
      - "${SAKURADRIVE_PORT:-8099}:8080"

    environment:
      # Only affects log timestamps; the schedule uses the timezone set in the UI.
      TZ: ${TZ:-America/Los_Angeles}
      SAKURADRIVE_LOG_LEVEL: ${SAKURADRIVE_LOG_LEVEL:-info}
      # Set to true only on a trusted network, or behind an authenticating proxy.
      SAKURADRIVE_DISABLE_AUTH: ${SAKURADRIVE_DISABLE_AUTH:-false}

    volumes:
      # Database, generated export bundles and the Kopia cache. Follows the same
      # Tier2/Docker convention as the other stacks.
      - /mnt/m/Tier2/Docker/sakuradrive_data:/data

      # ------------------------------------------------------------------
      # SSD pool (M:) and its three member disks.
      #
      # M: is a DrivePool pool over D:, E: and F: — the used figures add up exactly
      # (878.94 + 849.01 + 797.08 = 2525.02 GB). The members have drive letters, so
      # they can be catalogued individually with no extra work on the host.
      #
      # Catalogue the *members*, not M: itself. SakuraDrive builds the pool view from
      # them, which costs one read instead of two and additionally tells you how many
      # disks hold each file.
      # ------------------------------------------------------------------
      - /mnt/d:/mnt/parts/ssd-bay3:ro
      - /mnt/e:/mnt/parts/ssd-bay2:ro
      - /mnt/f:/mnt/parts/ssd-bay1:ro

      # ------------------------------------------------------------------
      # HDD pool (J:) member disks.
      #
      # These 14 disks have no drive letters, so WSL2 cannot see them at /mnt/<letter>
      # and neither can this container. Mount each one into an empty NTFS folder on
      # Windows first — see docs/AGENT.md, "Pool disks without drive letters" — then
      # add one line here per disk. Until then the HDD pool cannot be catalogued.
      #
      # - /mnt/c/PoolDisks/DRIVEPOOL4:/mnt/parts/drivepool4:ro
      # - /mnt/c/PoolDisks/DRIVEPOOL9:/mnt/parts/drivepool9:ro
      # ...one per pool disk
      # ------------------------------------------------------------------

      # The pooled views themselves. Not catalogued — mounted only so the interface can
      # report pool capacity and so "Check mount" can confirm the pool is online.
      - /mnt/j:/mnt/pools/drivepool:ro
      - /mnt/m:/mnt/pools/ssdpool:ro

      # ------------------------------------------------------------------
      # Where automatic export bundles are written.
      #
      # D:\ is already in the Kopia repository (`Administrator@tokyo-3:D:\`), so a
      # bundle written here reaches Backblaze with the next snapshot — which is the
      # whole point: the catalog has to survive the machine that holds it.
      # ------------------------------------------------------------------
      - /mnt/d/SakuraDriveExports:/backup/sakuradrive
