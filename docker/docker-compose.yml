# SakuraDrive on Docker inside WSL2, for tokyo-3.
#
# Everything else — schedule, notifications, thresholds, backup expectations — is
# configured from the web interface. This file only covers what Docker owns: the port,
# the data volume, and which host paths the container can see.
#
# Windows drives appear inside WSL2 under /mnt/<letter>. Every pool mount is read-only
# on purpose: SakuraDrive never writes to your data.
#
# The image is pulled, not built here. CI builds it, smoke-tests it and pushes it to
# GHCR, so updating is a pull and a restart — which is the operation Portainer's stack
# update actually performs. To build from source instead, add the override:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.build.yml \
#     up -d --build
#
# The package is private, like the repository. Portainer needs a registry credential
# for ghcr.io before it can pull; see docs/DEPLOY.md.

services:
  sakuradrive:
    # Pin to a commit with SAKURADRIVE_TAG=sha-abc1234 when rolling back.
    image: ghcr.io/dsdude123/sakuradrive:${SAKURADRIVE_TAG:-latest}
    # Always ask the registry. Silently running a stale image while wondering why a fix
    # did not land is the failure this is here to prevent.
    pull_policy: always
    container_name: sakuradrive
    restart: unless-stopped

    ports:
      # Override with SAKURADRIVE_PORT. Check the host port is free first: `ss -ltnp`.
      - "${SAKURADRIVE_PORT:-8099}:8080"

    environment:
      # Only affects log timestamps; the schedule uses the timezone set in the UI.
      TZ: ${TZ:-America/Los_Angeles}
      SAKURADRIVE_LOG_LEVEL: ${SAKURADRIVE_LOG_LEVEL:-info}
      # Set to true only on a trusted network, or behind an authenticating proxy.
      SAKURADRIVE_DISABLE_AUTH: ${SAKURADRIVE_DISABLE_AUTH:-false}

    volumes:
      # Database, generated export bundles and the Kopia cache. Follows the same
      # Tier2/Docker convention as the other stacks.
      - /mnt/m/Tier2/Docker/sakuradrive_data:/data

      # ------------------------------------------------------------------
      # No pool disks are mounted here, and none need to be.
      #
      # The agent reads every catalog root on the Windows side and streams the results
      # back. That is not a workaround for the letterless disks -- though it is the only
      # thing that works for them, since WSL2 only surfaces lettered drives and drvfs
      # will not follow a folder mount point into another volume -- it is how the
      # container stops caring how the host is laid out. Add a disk to the array, move
      # to a bigger machine, re-letter everything: nothing here changes.
      #
      # Configure the roots in Settings -> Catalog roots. The path picker lists the pool
      # parts the agent has found, so nobody types a volume GUID.
      #
      # See docs/ARCHITECTURE.md, "Who reads the disks".
      # ------------------------------------------------------------------

      # ------------------------------------------------------------------
      # Where automatic export bundles are written.
      #
      # D:\ is already in the Kopia repository (`Administrator@tokyo-3:D:\`), so a
      # bundle written here reaches Backblaze with the next snapshot — which is the
      # whole point: the catalog has to survive the machine that holds it.
      # ------------------------------------------------------------------
      - /mnt/d/SakuraDriveExports:/backup/sakuradrive
