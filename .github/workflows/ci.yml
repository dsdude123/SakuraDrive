name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  node:
    name: Type check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  agent:
    name: Agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.5.0

      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./agent/tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Check compatibility with Windows PowerShell 5.1
        shell: pwsh
        run: |
          # The host is Windows Server, which ships Windows PowerShell 5.1 and nothing
          # else. PSScriptAnalyzer checks the syntax and the cmdlet surface against a
          # real 5.1 profile, which is the only way to catch this without a Windows box.
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $settings = @{
            Rules = @{
              PSUseCompatibleSyntax = @{ Enable = $true; TargetVersions = @('5.1', '7.0') }
              PSUseCompatibleCommands = @{
                Enable = $true
                TargetProfiles = @('win-8_x64_10.0.17763.0_5.1.17763.316_x64_4.0.30319.42000_framework')
              }
            }
          }
          # The files the Windows host actually runs, taken from the agent's own list
          # rather than a copy here: a hand-kept list had already lost the uninstaller,
          # so a file could ship to a host without ever being checked against 5.1.
          # The Pester tests run under Pester 5 here and on a developer machine, never
          # on the server.
          Import-Module ./agent/SakuraDrive.Agent.psm1 -Force
          $runtime = @(
            Get-AgentDistributionFile |
              Where-Object { $_ -match '\.psm?1$' } |
              ForEach-Object { "./agent/$_" }
          )
          Write-Host "Checking $($runtime.Count) files against Windows PowerShell 5.1."
          $found = @()
          foreach ($path in $runtime) {
            $found += Invoke-ScriptAnalyzer -Path $path -Settings $settings |
              Where-Object { $_.RuleName -like 'PSUseCompatible*' }
          }
          if ($found) {
            $found | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap
            exit 1
          }
          Write-Host 'No Windows PowerShell 5.1 compatibility problems.'

      - name: Check the contract fixture is up to date
        shell: pwsh
        run: |
          # The fixture the server's contract test consumes is generated by the agent's
          # own parsers, so a change to either side that breaks the protocol shows up
          # here as a diff rather than as a silently broken agent.
          ./agent/tools/New-ContractFixture.ps1
          $diff = git diff --name-only
          if ($diff) {
            Write-Host "The agent contract fixture is stale. Re-run agent/tools/New-ContractFixture.ps1 and commit the result."
            git diff
            exit 1
          }

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f docker/Dockerfile -t sakuradrive:ci .

      - name: Start it and check it serves
        run: |
          docker run -d --name sakuradrive-ci -p 8080:8080 sakuradrive:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/health; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then docker logs sakuradrive-ci; exit 1; fi
          curl -sf http://127.0.0.1:8080/api/auth/status | grep -q needsSetup
          docker exec sakuradrive-ci kopia --version
          docker rm -f sakuradrive-ci
